<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery | IITGN Ganeshotsav</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.39/dist/lenis.min.js"></script>

  <style>
    html,
    body {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #FDDE6C;
      color: #782F1D;
      margin: 0;
      overflow-x: hidden;
    }

    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    .font-accent {
      font-family: 'Great Vibes', cursive;
    }

    .bg-seamless {
      background: linear-gradient(to bottom, #FDDE6C 0%, #FFF5D1 25%, #FFF8E7 60%, #FFF5D1 85%, #FDDE6C 100%);
    }

    /* Header Vibe Animations */
    @keyframes pulse-glow {

      0%,
      100% {
        opacity: 0.3;
        transform: scale(0.9);
      }

      50% {
        opacity: 0.6;
        transform: scale(1.1);
      }
    }

    .animate-glow {
      animation: pulse-glow 5s ease-in-out infinite;
      transform-origin: center;
    }

    /* Masonry Layout */
    .masonry-grid {
      column-count: 1;
      column-gap: 1.5rem;
    }

    @media (min-width: 640px) {
      .masonry-grid {
        column-count: 2;
      }
    }

    @media (min-width: 1024px) {
      .masonry-grid {
        column-count: 3;
      }
    }

    /* Hardware Accelerated Items */
    .masonry-item {
      break-inside: avoid;
      margin-bottom: 1.5rem;
      opacity: 0;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      will-change: transform, opacity;
    }

    .img-wrapper {
      overflow: hidden;
      border-radius: 1.5rem;
      position: relative;
      transform: translateZ(0);
      box-shadow: 0 10px 30px -5px rgba(120, 47, 29, 0.15);
    }

    .img-wrapper img,
    .img-wrapper video {
      width: 100%;
      display: block;
      transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    @media (hover: hover) {

      .img-wrapper:hover img,
      .img-wrapper:hover video {
        transform: scale(1.04);
      }
    }

    /* Invisible overlay to strictly trap all video clicks */
    .video-shield {
      position: absolute;
      inset: 0;
      z-index: 10;
      cursor: default;
    }
  </style>
</head>

<body class="bg-seamless min-h-screen">

  <!-- Navbar -->
  <nav
    class="w-full px-6 py-5 flex items-center z-50 bg-white/30 backdrop-blur-md border-b border-amber-900/10 sticky top-0">
    <a href="index.html"
      class="flex items-center gap-2 text-red-800 font-semibold hover:text-red-950 transition-colors">
      <span class="text-xl leading-none">&larr;</span> Back to Home
    </a>
  </nav>

  <!-- Reverted & Enhanced Header to match the original index vibe -->
  <header class="relative text-center pt-24 pb-20 px-4 w-full flex flex-col items-center gs-header overflow-hidden">
    <!-- Glowing background elements -->
    <div class="absolute inset-0 w-full h-full flex justify-center items-center pointer-events-none z-0">
      <div
        class="absolute w-[80vw] h-[80vw] max-w-[700px] max-h-[700px] bg-yellow-100 rounded-full blur-[70px] animate-glow mix-blend-overlay">
      </div>
    </div>

    <div class="relative z-10 w-full px-4">
      <span class="font-accent text-4xl sm:text-5xl text-amber-600/90 block mb-2">A collection of</span>
      <h1
        class="font-cinzel font-bold text-[13vw] sm:text-7xl md:text-8xl text-red-800 mb-6 tracking-normal sm:tracking-widest drop-shadow-sm pb-2 uppercase leading-none">
        Photobook</h1>
      <div class="w-20 h-1 bg-red-700 mx-auto mb-6 rounded-full opacity-80"></div>
      <p class="text-amber-950 text-sm sm:text-lg max-w-xl mx-auto font-medium px-2 leading-relaxed">Revisit the
        devotion, energy, and artistic brilliance of past Ganeshotsav celebrations.</p>
    </div>
  </header>

  <!-- Masonry Gallery -->
  <main class="max-w-7xl mx-auto px-6 pb-32 relative z-10">
    <div class="masonry-grid">

      <div class="masonry-item">
        <div class="img-wrapper border-[6px] border-white/80">
          <img src="assets/image_ed7910.png" alt="Sthapana" loading="lazy">
        </div>
      </div>

      <!-- Video card with controls removed and an interaction shield added -->
      <div class="masonry-item">
        <div class="img-wrapper border-[6px] border-white/80 bg-amber-950 relative">
          <div class="video-shield"></div>
          <video src="assets/reel.mp4" autoplay loop muted playsinline class="pointer-events-none object-cover"></video>
        </div>
      </div>

      <div class="masonry-item">
        <div class="img-wrapper border-[6px] border-white/80">
          <img src="assets/image_ed792c.png" alt="Floral Decoration" loading="lazy">
        </div>
      </div>

      <div class="masonry-item">
        <div class="img-wrapper border-[6px] border-white/80">
          <img src="assets/image_ed794e.png" alt="ISRO Theme" loading="lazy">
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="pb-16 text-center font-semibold tracking-widest text-xs uppercase flex flex-col gap-2 relative z-10">
    <p class="text-amber-900/60">IIT Gandhinagar • Team Ganesha 2026</p>
    <p class="text-amber-900/40 text-[9px] sm:text-[10px]">Credit - Abhiraj Meshram AI BTech '30</p>
  </footer>

  <script>
    // Smooth Scroll Setup
    const lenis = new Lenis({
      duration: 1.2,
      smooth: true,
      smoothTouch: false
    });
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add((time) => lenis.raf(time * 1000));
    gsap.ticker.lagSmoothing(0, 0);

    gsap.registerPlugin(ScrollTrigger);

    // Header Entrance Animation
    const tl = gsap.timeline();
    tl.fromTo(".gs-header span", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 1, ease: "power2.out" })
      .fromTo(".gs-header h1", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 1.2, ease: "power3.out" }, "-=0.6")
      .fromTo(".gs-header div, .gs-header p", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 1, stagger: 0.2, ease: "power2.out" }, "-=0.8");

    // Masonry Items Lightweight Reveal
    gsap.utils.toArray('.masonry-item').forEach((item) => {
      gsap.fromTo(item,
        { opacity: 0, y: 60 },
        {
          opacity: 1,
          y: 0,
          duration: 0.8,
          ease: "power2.out",
          scrollTrigger: {
            trigger: item,
            start: "top 90%",
            toggleActions: "play none none reverse"
          }
        }
      );
    });
  </script>
</body>

</html>
