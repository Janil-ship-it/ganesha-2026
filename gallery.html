<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery | IITGN Ganeshotsav</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.39/dist/lenis.min.js"></script>
  
  <style>
    html, body { -ms-overflow-style: none; scrollbar-width: none; }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
    body { font-family: 'Poppins', sans-serif; background-color: #FDDE6C; color: #782F1D; margin: 0; overflow-x: hidden; }
    
    .font-cinzel { font-family: 'Cinzel', serif; }
    .bg-seamless { background: linear-gradient(to bottom, #FDDE6C 0%, #FFF5D1 30%, #FFF8E7 100%); }
    
    /* Masonry Layout */
    .masonry-grid { column-count: 1; column-gap: 1.5rem; }
    @media (min-width: 640px) { .masonry-grid { column-count: 2; } }
    @media (min-width: 1024px) { .masonry-grid { column-count: 3; } }
    
    /* Hardware Accelerated Items */
    .masonry-item {
      break-inside: avoid;
      margin-bottom: 1.5rem;
      opacity: 0; 
      transform: translate3d(0, 0, 0); 
      backface-visibility: hidden;
      will-change: transform, opacity;
    }
    
    .img-wrapper { 
      overflow: hidden; 
      border-radius: 1.5rem; 
      position: relative; 
      transform: translateZ(0); 
    }
    
    .img-wrapper img, .img-wrapper video {
      width: 100%; 
      display: block;
      transition: transform 0.4s ease-out;
    }
    
    @media (hover: hover) {
      .img-wrapper:hover img { transform: scale(1.03); }
    }
  </style>
</head>
<body class="bg-seamless min-h-screen">

  <!-- Navbar -->
  <nav class="w-full px-6 py-5 flex items-center z-50 bg-white/30 backdrop-blur-md border-b border-amber-900/10 sticky top-0">
    <a href="index.html" class="flex items-center gap-2 text-red-800 font-semibold hover:text-red-950 transition-colors">
      <span class="text-xl leading-none">&larr;</span> Back to Home
    </a>
  </nav>

<!-- Header -->
  <header class="text-center pt-20 pb-16 px-4 w-full flex flex-col items-center gs-header">
    <!-- Switched to fluid text-[12vw] for mobile and reduced tracking to keep it inside the screen -->
    <h1 class="font-cinzel font-bold text-[12vw] sm:text-6xl md:text-7xl bg-gradient-to-r from-red-800 to-amber-600 bg-clip-text text-transparent mb-4 tracking-normal sm:tracking-widest drop-shadow-sm pb-2 px-2 max-w-full leading-tight">Photobook</h1>
    <p class="text-amber-800 text-sm sm:text-lg max-w-xl mx-auto font-medium px-2">Revisit the devotion, energy, and artistic brilliance of past Ganeshotsav celebrations.</p>
  </header>
  <!-- Masonry Gallery -->
  <main class="max-w-7xl mx-auto px-6 pb-32">
    <div class="masonry-grid">
      
      <div class="masonry-item">
        <div class="img-wrapper shadow-xl border-[6px] border-white/80">
          <img src="image_ed7910.png" alt="Sthapana" loading="lazy">
        </div>
      </div>

      <div class="masonry-item">
        <div class="img-wrapper shadow-xl border-[6px] border-amber-800/20 bg-black">
          <video src="reel.mp4" autoplay loop muted playsinline controls></video>
        </div>
      </div>

      <div class="masonry-item">
        <div class="img-wrapper shadow-xl border-[6px] border-white/80">
          <img src="image_ed792c.png" alt="Floral Decoration" loading="lazy">
        </div>
      </div>

      <div class="masonry-item">
        <div class="img-wrapper shadow-xl border-[6px] border-white/80">
          <img src="image_ed794e.png" alt="ISRO Theme" loading="lazy">
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="pb-16 text-center font-semibold tracking-widest text-xs uppercase flex flex-col gap-1.5">
    <p class="text-amber-900/50">IIT Gandhinagar • Team Ganesha 2026</p>
    <p class="text-amber-900/40 text-[9px] sm:text-[10px]">Credit - Abhiraj Meshram AI BTech '30</p>
  </footer>

  <script>
    // Smooth Scroll Setup
    const lenis = new Lenis({ 
      duration: 1.5, 
      smooth: true,
      smoothTouch: false 
    });
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add((time) => lenis.raf(time * 1000));
    gsap.ticker.lagSmoothing(0, 0);

    gsap.registerPlugin(ScrollTrigger);

    // Header Entrance
    gsap.fromTo(".gs-header h1, .gs-header p", 
      { y: 30, opacity: 0 },
      { y: 0, opacity: 1, duration: 1.2, stagger: 0.2, ease: "power2.out" }
    );

    // Lightweight Reveal
    gsap.utils.toArray('.masonry-item').forEach((item) => {
      gsap.fromTo(item, 
        { opacity: 0, y: 60 },
        { 
          opacity: 1, 
          y: 0, 
          duration: 0.8, 
          ease: "power2.out",
          scrollTrigger: { 
            trigger: item, 
            start: "top 90%", 
            toggleActions: "play none none reverse"
          }
        }
      );
    });
  </script>
</body>
</html>
